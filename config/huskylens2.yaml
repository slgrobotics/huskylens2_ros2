
huskylens2_i2c_node:
  ros__parameters:
    frame_id:     huskylens2_link_optical
    i2c_bus:      1        # Raspberry Pi I2C bus (1 = /dev/i2c-1 on RPi4)
    i2c_address:  0x50     # Device responds at this address on this hardware
    algorithm:    'object_recognition'  # Can be overridden in the launch file
    poll_rate:    10.0     # Hz
    image_width:  640      # Reference resolution used to normalize coordinates
    image_height: 480

huskylens2_mcp_node:
  ros__parameters:
    frame_id:     huskylens2_link_optical
    camera_module: wide_angle   # stock, wide_angle, or quoted "HFOV,VFOV"
    mcp_server:   "http://huskylens.local:3000"  # MCP server URL (do not include "/sse")
    algorithm_id: 2        # HuskyLens application ID used by self.get_recognition_result (2='object_recognition')
                           # 1=Face Recognition, 2=Object Recognition, 3=Line Tracking, 4=Color Recognition,
                           # 5=Tag Recognition, 6=Gesture Recognition, 7=Pose Recognition, 8=Hand Tracking,
                           # 9=OCR, 10=QR Code, 11=Barcode
    poll_rate:    10.0     # Hz (actual MCP response rate: about 1 Hz)
    image_width:  640      # Reference resolution used to normalize coordinates
    image_height: 480
    mcp_timeout:  5.0

depth_node:
  ros__parameters:
    input_topic:  huskylens/image/compressed
    output_topic: huskylens/depth/image
    camera_info_output_topic: huskylens/depth/camera_info  # re-published with same timestamp as depth image
    depth_server: "http://127.0.0.1:5001/depth"
    request_timeout: 10.0
    queue_size: 1

depth_to_laserscan_node:
  ros__parameters:
    target_frame: huskylens2_link
    input_topic:  huskylens/depth/image
    output_topic: huskylens/scan
    camera_info_topic: huskylens/depth/camera_info
    num_scan_bins: 160  # good for 640x480 depth image, 4 depth pixels per scan bin
    min_height: -0.1
    max_height: -0.1
    range_min:   0.2
    range_max:  10.0
    scan_time:   0.1
